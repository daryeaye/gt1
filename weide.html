<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merchant's Quest 1</title>
  <style>
    /* Center the app container on the screen */
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://t-pbl.com/geotopia/thatsit2.png') no-repeat center center fixed;
      background-size: cover;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* The container remains 960px x 540px */
    #container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 1px solid #ccc;
      background: white;
      overflow: hidden;
    }

    /* Pages are absolutely positioned inside the container */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      display: none;
      background-size: cover;
      background-position: center;
    }

    .page.active {
      display: block;
    }

    /* Style for the clickable box */
    .box {
      position: absolute;
      border: 1px solid red;
      background-color: rgba(255, 0, 0, 0.3);
    }

    .transparent-box {
  border: none;
  background-color: transparent;
}

    /* Navigation buttons styling */
    #nav-buttons {
      margin-top: 10px;
    }

    button {
      font-family: "Comic Sans MS", sans-serif;
      font-size: 20px;
      background-color: lightblue;
      border: none;
      padding: 10px 20px;
      margin: 0 5px;
      cursor: pointer;
    }
  </style>
  
  <!-- Additional Side Widget Resources -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Side widget styling */
    #side-widget {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 200px;
      height: 200px;
      background: #f9f9f9;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      font-family: 'Caveat', cursive;
      z-index: 999;
    }

    #side-widget p.title {
      font-size: 24px;
      text-align: center;
      margin: 0 0 10px;
    }

    #side-widget button,
    #side-widget a {
      display: block;
      margin: 0 auto;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      background: lightblue;
      border: none;
      padding: 10px;
      text-decoration: none;
      color: inherit;
    }

    /* Selection overlay styles */
    #selection-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 1000;
    }

    #selection-box {
      position: absolute;
      border: 2px dashed red;
      background: rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div id="app-container">
    <div id="container">

      <!-- New Page 1 with background image gt8/1.jpg -->
      <div id="page1" class="page active" style="background: url('https://t-pbl.com/gt8/1.jpg') no-repeat center/cover;">
        <!-- New clickable box -->
        <a href="https://t-pbl.com/gt8/1.png" target="_blank">
<div class="box transparent-box" style="left: 84px; top: 123px; width: 229px; height: 268px;"></div>        </a>
      </div>

      <!-- Original Page 1, now Page 2 -->
      <div id="page2" class="page" style="background: url('https://t-pbl.com/gt1/1-20.jpg') no-repeat center/cover;">
        <h2 style="text-align:center; padding-top: 240px; color: white;"></h2>
      </div>

      <!-- Original Page 2, now Page 3 -->
      <div id="page3" class="page" style="background: url('https://t-pbl.com/gt1/1-21.jpg') no-repeat center/cover;">
        <h2 style="text-align:center; padding-top: 240px; color: white;"></h2>

        <!-- Original clickable box on Page 3 -->
        <a href="https://polypad.amplify.com/p/g8eh7VTDvyYA" target="_blank">
          <div class="box" style="left: 639px; top: 19px; width: 134px; height: 49px;"></div>
        </a>
      </div>

    </div>

    <!-- Navigation buttons -->
    <div id="nav-buttons">
      <button id="prev-btn" onclick="prevPage()">Previous</button>
      <button id="next-btn" onclick="nextPage()">Next</button>
    </div>
  </div>
  
  <!-- Side Widget -->
  <div id="side-widget">
    <p class="title">Need translation?</p>
    <button id="select-text">Select Text</button>
    <p>
      <a href="https://translate.google.com/?sl=en&tl=es&op=images" target="_blank">
        Click me and paste from clipboard
      </a>
    </p>
  </div>
  
  <!-- Side Widget Script -->
  <script>
    document.getElementById('select-text').addEventListener('click', function() {
      // Create overlay for user selection
      const overlay = document.createElement('div');
      overlay.id = 'selection-overlay';
      document.body.appendChild(overlay);
      
      let startX, startY, selectionBox;
      
      overlay.addEventListener('mousedown', function(e) {
        startX = e.clientX;
        startY = e.clientY;
        
        selectionBox = document.createElement('div');
        selectionBox.id = 'selection-box';
        selectionBox.style.left = startX + 'px';
        selectionBox.style.top = startY + 'px';
        selectionBox.style.width = '0px';
        selectionBox.style.height = '0px';
        overlay.appendChild(selectionBox);
        
        function mouseMoveHandler(e) {
          const currentX = e.clientX;
          const currentY = e.clientY;
          const rectLeft = Math.min(startX, currentX);
          const rectTop = Math.min(startY, currentY);
          const rectWidth = Math.abs(currentX - startX);
          const rectHeight = Math.abs(currentY - startY);

          selectionBox.style.left = rectLeft + 'px';
          selectionBox.style.top = rectTop + 'px';
          selectionBox.style.width = rectWidth + 'px';
          selectionBox.style.height = rectHeight + 'px';
        }
        
        function mouseUpHandler(e) {
          overlay.removeEventListener('mousemove', mouseMoveHandler);
          overlay.removeEventListener('mouseup', mouseUpHandler);
          
          const boxRect = selectionBox.getBoundingClientRect();
          document.body.removeChild(overlay);
          
          // Target the content area you wish to capture
          const target = document.getElementById('container');
          const targetRect = target.getBoundingClientRect();
          
          // Use html2canvas to capture the target element
          html2canvas(target, { useCORS: true, allowTaint: false }).then(canvas => {
            // Calculate scale factor for accurate cropping
            const scaleFactor = canvas.width / targetRect.width;
            const sx = (boxRect.left - targetRect.left) * scaleFactor;
            const sy = (boxRect.top - targetRect.top) * scaleFactor;
            const sWidth = boxRect.width * scaleFactor;
            const sHeight = boxRect.height * scaleFactor;
            
            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = sWidth;
            croppedCanvas.height = sHeight;

            const ctx = croppedCanvas.getContext('2d');
            ctx.drawImage(canvas, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);
            
            // Copy the cropped image to the clipboard
            croppedCanvas.toBlob(blob => {
              if (blob) {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(() => {
                  alert('Screenshot copied to clipboard.');
                }).catch(err => {
                  console.error('Failed to copy screenshot to clipboard', err);
                  alert('Failed to copy screenshot to clipboard.');
                });
              }
            });
          });
        }
        
        overlay.addEventListener('mousemove', mouseMoveHandler);
        overlay.addEventListener('mouseup', mouseUpHandler);
      });
    });
  </script>
  
  <!-- Main Code Script -->
  <script>
    let currentPage = 1;
    const totalPages = 3;
    
    // Function to display the correct page and toggle button visibility.
    function showPage(pageNum) {
      for (let i = 1; i <= totalPages; i++) {
        document.getElementById('page' + i).classList.remove('active');
      }

      document.getElementById('page' + pageNum).classList.add('active');
      
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");

      // On the first page, hide Previous.
      if (pageNum === 1) {
        prevBtn.style.display = "none";
        nextBtn.style.display = "inline-block";
      } 
      // On the last page, hide Next.
      else if (pageNum === totalPages) {
        prevBtn.style.display = "inline-block";
        nextBtn.style.display = "none";
      } 
      // On middle pages, show both buttons.
      else {
        prevBtn.style.display = "inline-block";
        nextBtn.style.display = "inline-block";
      }
    }
    
    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        showPage(currentPage);
      }
    }
    
    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        showPage(currentPage);
      }
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      showPage(currentPage);
    });
  </script>
</body>
</html>
